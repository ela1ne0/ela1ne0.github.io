<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebraska Flood Awareness Initiative – Elaine Yu</title>
  <meta name="description" content="This case study has moved to elaineyu.design." />
  <link rel="canonical" href="https://elaineyu.design" />
  <meta http-equiv="refresh" content="3; url=https://elaineyu.design" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/assets/dragon png - left facing copy.png">
  <style>
    :root{
      --bg: #ffffff;
      --text: #00306E;
      --text-muted: #4B6D99;
      --accent: #78A3DE;
      --border-subtle: #e0e0e0;
    }
    *, *::before, *::after{ box-sizing: border-box; }
    html, body{ margin: 0; min-height: 100vh; }
    body{
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .wrap{
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .card{ max-width: 560px; text-align: center; }
    .logo{
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text);
      text-decoration: none;
      display: inline-block;
      margin-bottom: 40px;
    }
    .kicker{
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 16px;
    }
    h1{
      font-size: clamp(28px, 4vw, 38px);
      line-height: 1.25;
      font-weight: 600;
      margin: 0 0 16px;
      letter-spacing: -0.01em;
    }
    p.lede{
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0 0 32px;
    }
    .btn{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border: 1px solid var(--text);
      background: var(--text);
      color: #fff;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:hover{ transform: translateY(-1px); background: #002655; }
    .stars{
      color: var(--accent);
      font-size: 20px;
      letter-spacing: 4px;
      margin: 0 0 20px;
    }
    footer{
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <span class="logo">Elaine 俞</span>
      <p class="kicker">Product Design · Visual Media</p>
      <p class="stars">✴˚⋆ ✦</p>
      <h1>This case study has moved</h1>
      <p class="lede">
        You'll now find my work at <strong>elaineyu.design</strong>.
        Redirecting you there automatically — or click below if it doesn't happen.
      </p>
      <a class="btn" href="https://elaineyu.design">Go to elaineyu.design →</a>
    </div>
  </div>
  <footer>
    <p>&copy;<span id="year"></span> Elaine Yu</p>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
